name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint TSV Formats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run TSV Linter
        run: |
          chmod +x scripts/lint-tsv.sh
          ./scripts/lint-tsv.sh

      - name: Check Profile Consistency
        run: |
          chmod +x scripts/check-profiles.sh
          ./scripts/check-profiles.sh

  track-linux:
    name: Track (${{ matrix.distro }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
            setup: pacman -Syu --noconfirm bash grep gawk findutils coreutils
          - distro: ubuntu
            image: ubuntu:24.04
            setup: |
              apt-get update
              apt-get install -y bash grep gawk findutils coreutils software-properties-common
              add-apt-repository -y universe
              apt-get update
          - distro: debian
            image: debian:bookworm-slim
            setup: |
              apt-get update
              apt-get install -y bash grep gawk findutils coreutils
              sed -i 's/main/main contrib non-free non-free-firmware/g' /etc/apt/sources.list.d/debian.sources || true
              apt-get update
          - distro: fedora
            image: fedora:latest
            setup: dnf install -y --allowerasing bash grep gawk findutils coreutils
          - distro: rhel
            image: rockylinux:9
            setup: |
              dnf install -y --allowerasing bash grep gawk findutils epel-release
              dnf config-manager --set-enabled crb || true
          - distro: alpine
            image: alpine:latest
            setup: |
              apk update
              apk add bash grep gawk findutils coreutils
              echo "http://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
              apk update

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Prerequisites
        run: ${{ matrix.setup }}

      - name: Track Package Versions
        run: |
          chmod +x scripts/track-updates.sh
          ./scripts/track-updates.sh ${{ matrix.distro }}

      - name: Upload Lockfile and Summary
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.distro }}
          path: |
            packages/locks/${{ matrix.distro }}.lock
            updates_${{ matrix.distro }}.txt
          if-no-files-found: ignore

  track-nix:
    name: Track (nix)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        run: |
          curl -fsSL https://nixos.org/nix/install -o /tmp/nix-install.sh
          sh /tmp/nix-install.sh --no-daemon --no-channel-add
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Pin nixpkgs Channel
        run: |
          CHANNEL="$(awk -F'\t' '$4 == "current" { print $3; exit }' packages/meta/nix-releases.tsv)"
          if [ -z "$CHANNEL" ]; then
            echo "error: no release marked 'current' in packages/meta/nix-releases.tsv"
            exit 1
          fi
          echo "tracking nixpkgs channel: $CHANNEL"
          nix-channel --add "https://nixos.org/channels/${CHANNEL}" nixpkgs
          nix-channel --update
          echo "NIX_PATH=$HOME/.nix-defexpr/channels" >> "$GITHUB_ENV"

      - name: Track nixpkgs Attribute Versions
        run: |
          chmod +x scripts/track-updates.sh scripts/nix-query.sh
          ./scripts/track-updates.sh nix

      - name: Upload Lockfile and Summary
        uses: actions/upload-artifact@v4
        with:
          name: result-nix
          path: |
            packages/locks/nix.lock
            updates_nix.txt
          if-no-files-found: ignore

  track-macos:
    name: Track (macos)
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Track Homebrew Formula Versions
        run: |
          chmod +x scripts/track-updates.sh
          ./scripts/track-updates.sh macos

      - name: Upload Lockfile and Summary
        uses: actions/upload-artifact@v4
        with:
          name: result-macos
          path: |
            packages/locks/macos.lock
            updates_macos.txt
          if-no-files-found: ignore

  commit-sync:
    name: Commit Package Updates
    needs: [track-linux, track-nix, track-macos]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download Track Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble Commit Message
        run: |
          mkdir -p packages/locks
          find artifacts/ -name "*.lock" -exec cp {} packages/locks/ \;

          BODY_FILE="$(mktemp)"
          find artifacts/ -name "updates_*.txt" -exec cat {} + >> "$BODY_FILE"

          MSG_FILE="$(mktemp)"
          if [ -s "$BODY_FILE" ]; then
            echo "chore(ci): auto-update package status matrix [skip ci]" > "$MSG_FILE"
            echo "" >> "$MSG_FILE"
            cat "$BODY_FILE" >> "$MSG_FILE"
          else
            echo "chore(ci): initialize package version locks [skip ci]" > "$MSG_FILE"
          fi

          echo "COMMIT_MSG_PATH=$MSG_FILE" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add packages/locks/

          if git diff --staged --quiet; then
            echo "No package updates detected across distributions. Skipping commit."
            exit 0
          fi

          git commit -F "$COMMIT_MSG_PATH"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref }}
